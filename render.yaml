services:
  - type: web
    name: melody-ai
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: melody-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: melody-ai-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://melody-ai.onrender.com

  - type: redis
    name: melody-ai-redis
    plan: free
    ipAllowList: []

databases:
  - name: melody-ai-db
    plan: free
    postgresMajorVersion: 16
